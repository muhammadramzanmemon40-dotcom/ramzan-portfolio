<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#0E0E12"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#25252D" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bgGrad)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <!-- Card 1: Geometric Marks -->
  <g transform="translate(100, 150)">
    <rect width="320" height="700" rx="16" fill="#18181E" stroke="#2D2D38" stroke-width="1.5"/>
    <circle cx="160" cy="240" r="72" fill="#E65100"/>
    <text x="160" y="260" font-family="'Syne', 'Inter', sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" text-anchor="middle">M</text>
    <text x="160" y="400" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="24" font-weight="700" fill="#F5F3EF" text-anchor="middle">Geometric Marks</text>
    <text x="160" y="440" font-family="'Inter', sans-serif" font-size="14" fill="#A4A4AA" text-anchor="middle">Precise circular &amp; grid-based</text>
    <text x="160" y="465" font-family="'Inter', sans-serif" font-size="14" fill="#A4A4AA" text-anchor="middle">vector balance for brand seals</text>
    <rect x="50" y="520" width="220" height="34" rx="17" fill="#24242E" stroke="#363644" stroke-width="1"/>
    <text x="160" y="542" font-family="'JetBrains Mono', monospace" font-size="12" fill="#C7FF4D" text-anchor="middle" font-weight="600">CIRCULAR GOLDEN RATIO</text>
  </g>

  <!-- Card 2: Abstract Symbols -->
  <g transform="translate(460, 150)">
    <rect width="320" height="700" rx="16" fill="#18181E" stroke="#2D2D38" stroke-width="1.5"/>
    <rect x="88" y="168" width="144" height="144" rx="20" fill="#1976D2"/>
    <polygon points="160,195 210,285 110,285" fill="#FFFFFF"/>
    <text x="160" y="400" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="24" font-weight="700" fill="#F5F3EF" text-anchor="middle">Abstract Symbols</text>
    <text x="160" y="440" font-family="'Inter', sans-serif" font-size="14" fill="#A4A4AA" text-anchor="middle">Dynamic diagonal shapes</text>
    <text x="160" y="465" font-family="'Inter', sans-serif" font-size="14" fill="#A4A4AA" text-anchor="middle">symbolizing speed &amp; innovation</text>
    <rect x="50" y="520" width="220" height="34" rx="17" fill="#24242E" stroke="#363644" stroke-width="1"/>
    <text x="160" y="542" font-family="'JetBrains Mono', monospace" font-size="12" fill="#C7FF4D" text-anchor="middle" font-weight="600">DYNAMIC APEX VECTOR</text>
  </g>

  <!-- Card 3: Custom Wordmarks -->
  <g transform="translate(820, 150)">
    <rect width="320" height="700" rx="16" fill="#18181E" stroke="#2D2D38" stroke-width="1.5"/>
    <rect x="88" y="198" width="144" height="84" rx="12" fill="#2E7D32"/>
    <text x="160" y="254" font-family="'Syne', 'Inter', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">RAM</text>
    <text x="160" y="400" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="24" font-weight="700" fill="#F5F3EF" text-anchor="middle">Custom Wordmarks</text>
    <text x="160" y="440" font-family="'Inter', sans-serif" font-size="14" fill="#A4A4AA" text-anchor="middle">Distinctive custom kerning &amp;</text>
    <text x="160" y="465" font-family="'Inter', sans-serif" font-size="14" fill="#A4A4AA" text-anchor="middle">tailored geometric letterforms</text>
    <rect x="50" y="520" width="220" height="34" rx="17" fill="#24242E" stroke="#363644" stroke-width="1"/>
    <text x="160" y="542" font-family="'JetBrains Mono', monospace" font-size="12" fill="#C7FF4D" text-anchor="middle" font-weight="600">BESPOKE TYPOGRAPHIC MARKS</text>
  </g>

  <!-- Card 4: Vector Drawing -->
  <g transform="translate(1180, 150)">
    <rect width="320" height="700" rx="16" fill="#18181E" stroke="#2D2D38" stroke-width="1.5"/>
    <circle cx="160" cy="240" r="72" fill="#C2185B"/>
    <!-- Pen tool nib icon -->
    <path d="M160,195 L182,238 L168,238 L168,268 L152,268 L152,238 L138,238 Z" fill="#FFFFFF"/>
    <circle cx="160" cy="248" r="4" fill="#C2185B"/>
    <text x="160" y="400" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="24" font-weight="700" fill="#F5F3EF" text-anchor="middle">Vector Drawing</text>
    <text x="160" y="440" font-family="'Inter', sans-serif" font-size="14" fill="#A4A4AA" text-anchor="middle">Complex pen tool paths</text>
    <text x="160" y="465" font-family="'Inter', sans-serif" font-size="14" fill="#A4A4AA" text-anchor="middle">delivered in infinitely scalable format</text>
    <rect x="50" y="520" width="220" height="34" rx="17" fill="#24242E" stroke="#363644" stroke-width="1"/>
    <text x="160" y="542" font-family="'JetBrains Mono', monospace" font-size="12" fill="#C7FF4D" text-anchor="middle" font-weight="600">PRECISION BEZIER CURVES</text>
  </g>
</svg>
